<label
  class="
    relative
    block
    h-6
    w-14
    bg-muted-200
    dark:bg-muted-700
    rounded-full
    scale-[0.8]
  "
>
  <input
    class="
      peer
      absolute
      top-0
      left-0
      w-full
      h-full
      opacity-0
      cursor-pointer
      z-10
    "
    type="checkbox"
    :checked="$store.app.isDark"
    @click="toggleTheme()"
  />
  <span
    class="
      absolute
      -top-2
      -left-1
      flex
      items-center
      justify-center
      h-10
      w-10
      bg-white
      dark:bg-muted-900
      border border-muted-200
      dark:border-muted-800
      rounded-full
      -ml-1
      peer-checked:ml-[45%] peer-checked:rotate-[360deg]
      transition-all
      duration-300
    "
  >
    <i
      class="iconify w-6 h-6 text-yellow-400 fill-current"
      data-icon="heroicons-solid:sun"
      x-show="!$store.app.isDark"
    ></i>
    <i
      class="iconify w-6 h-6 text-yellow-400 fill-current"
      data-icon="pepicons:moon-filled"
      x-show="$store.app.isDark"
    ></i>
  </span>
</label>
